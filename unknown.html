<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Registration Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            /* Background design */
            background:
                radial-gradient(circle at top left, #00eaff55, transparent 35%),
                radial-gradient(circle at bottom right, #ff00cc55, transparent 35%),
                linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        }

        /* Decorative circles */
        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            filter: blur(5px);
            z-index: -1;
        }

        body::before {
            width: 180px;
            height: 180px;
            background: #00eaff;
            top: 5%;
            left: 8%;
            opacity: 0.25;
        }

        body::after {
            width: 220px;
            height: 220px;
            background: #ff00cc;
            bottom: 5%;
            right: 8%;
            opacity: 0.25;
        }

        .form-box {
            width: 420px;
            padding: 35px;
            border-radius: 20px;

            /* Glass effect */
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 25px;
            font-size: 30px;
        }

        .input-box {
            margin-bottom: 18px;
        }

        label {
            display: block;
            color: white;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: none;
            outline: none;
            border-radius: 10px;

            background: rgba(255, 255, 255, 0.9);
            color: #222;
            font-size: 15px;
        }

        textarea {
            resize: none;
            height: 80px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            box-shadow: 0 0 0 3px #00eaff88;
        }

        .gender {
            display: flex;
            gap: 20px;
            color: white;
        }

        .gender label {
            font-weight: normal;
        }

        .gender input {
            width: auto;
            margin-right: 5px;
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;

            background: linear-gradient(90deg, #00c6ff, #0072ff);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;

            transition: 0.3s;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px #0072ff66;
        }

        .reset-btn {
            width: 100%;
            margin-top: 10px;
            padding: 11px;
            border: 1px solid white;
            border-radius: 10px;

            background: transparent;
            color: white;
            cursor: pointer;
        }

        .reset-btn:hover {
            background: rgba(255,255,255,0.15);
        }

        @media (max-width: 500px) {
            .form-box {
                width: 90%;
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="form-box">

        <h1>Registration Form</h1>

        <form>

            <div class="input-box">
                <label>Full Name</label>
                <input type="text" placeholder="Enter your name" required>
            </div>

            <div class="input-box">
                <label>Email</label>
                <input type="email" placeholder="Enter your email" required>
            </div>

            <div class="input-box">
                <label>Password</label>
                <input type="password" placeholder="Create password" required>
            </div>

            <div class="input-box">
                <label>Phone Number</label>
                <input type="tel" placeholder="Enter phone number">
            </div>

            <div class="input-box">
                <label>Date of Birth</label>
                <input type="date">
            </div>

            <div class="input-box">
                <label>Gender</label>

                <div class="gender">
                    <label>
                        <input type="radio" name="gender"> Male
                    </label>

                    <label>
                        <input type="radio" name="gender"> Female
                    </label>

                    <label>
                        <input type="radio" name="gender"> Other
                    </label>
                </div>
            </div>

            <div class="input-box">
                <label>Course</label>

                <select>
                    <option>Select Course</option>
                    <option>Science</option>
                    <option>Commerce</option>
                    <option>Arts</option>
                    <option>Computer Science</option>
                </select>
            </div>

            <div class="input-box">
                <label>Address</label>
                <textarea placeholder="Enter your address"></textarea>
            </div>

            <button class="submit-btn" type="submit">
                Register Now
            </button>

            <button class="reset-btn" type="reset">
                Reset
            </button>

        </form>

    </div>

</body>
</html>
