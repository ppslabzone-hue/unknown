
<!DOCTYPE html>
<html>
<head>
    <title>Realistic Fan</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #263238, #080b0d);
            font-family: Arial, sans-serif;
            color: white;
        }

        .room {
            text-align: center;
        }

        .fan {
            width: 320px;
            height: 320px;
            position: relative;
            margin: auto;
        }

        /* Fan outer grill */
        .grill {
            width: 280px;
            height: 280px;
            border: 12px solid #555;
            border-radius: 50%;
            position: absolute;
            left: 20px;
            top: 10px;
            background:
                repeating-radial-gradient(
                    circle,
                    transparent 0px,
                    transparent 35px,
                    rgba(255,255,255,0.15) 36px,
                    transparent 38px
                );
            box-shadow:
                0 0 20px #000,
                inset 0 0 20px #000;
        }

        /* Fan blades */
        .blades {
            width: 180px;
            height: 180px;
            position: absolute;
            left: 70px;
            top: 60px;
            transition: 0.3s;
        }

        .blades.running {
            animation: rotateFan 0.25s linear infinite;
        }

        @keyframes rotateFan {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .blade {
            position: absolute;
            width: 75px;
            height: 25px;
            background: linear-gradient(90deg, #555, #ddd, #555);
            border-radius: 80% 15% 15% 80%;
            left: 90px;
            top: 77px;
            transform-origin: left center;
        }

        .blade:nth-child(1) {
            transform: rotate(0deg);
        }

        .blade:nth-child(2) {
            transform: rotate(120deg);
        }

        .blade:nth-child(3) {
            transform: rotate(240deg);
        }

        /* Center motor */
        .center {
            position: absolute;
            width: 45px;
            height: 45px;
            background: radial-gradient(circle at 35% 30%, #eee, #777, #222);
            border-radius: 50%;
            left: 137px;
            top: 127px;
            z-index: 5;
            box-shadow: 0 0 10px #000;
        }

        /* Stand */
        .stand {
            width: 25px;
            height: 100px;
            background: linear-gradient(90deg, #333, #aaa, #333);
            margin: -2px auto 0;
            border-radius: 10px;
        }

        .base {
            width: 150px;
            height: 25px;
            background: linear-gradient(#777, #222);
            border-radius: 50%;
            margin: -5px auto;
        }

        button {
            margin-top: 30px;
            padding: 12px 35px;
            border: none;
            border-radius: 30px;
            background: #333;
            color: white;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 5px 15px #000;
        }

        button:hover {
            background: #555;
        }

        #status {
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
        }

        .on {
            color: #00ff88;
            text-shadow: 0 0 10px #00ff88;
        }

        .off {
            color: #ff4444;
        }
    </style>
</head>

<body>

<div class="room">

    <div class="fan">

        <div class="grill"></div>

        <div class="blades" id="blades">
            <div class="blade"></div>
            <div class="blade"></div>
            <div class="blade"></div>
        </div>

        <div class="center"></div>

    </div>

    <div class="stand"></div>
    <div class="base"></div>

    <button onclick="toggleFan()">⚡ FAN ON / OFF</button>

    <div id="status" class="off">
        FAN OFF
    </div>

</div>

<script>
    let fanOn = false;

    function toggleFan() {

        let blades = document.getElementById("blades");
        let status = document.getElementById("status");

        fanOn = !fanOn;

        if (fanOn) {
            blades.classList.add("running");

            status.innerHTML = "🟢 FAN ON";
            status.className = "on";

        } else {
            blades.classList.remove("running");

            status.innerHTML = "🔴 FAN OFF";
            status.className = "off";
        }
    }
</script>

</body>
</html>
